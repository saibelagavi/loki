name: Bug report
description: Something in LOKI does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste real secret values** here; use fake ones like `fake_value_1`.
        For a security problem, do not open an issue: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: LOKI version
      description: Shown on the unlock screen and in Settings.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import a .env with ...
        2. Open Compare ...
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: A sample .env that shows the problem (fake values only)
      render: dotenv
