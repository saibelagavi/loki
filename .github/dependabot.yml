# Dependency updates. Security fixes are opened as soon as an advisory lands; routine updates come
# once a week, grouped so there is one pull request per ecosystem. Every update goes through CI,
# including `npm run check:offline`, so an update that pulls in networking code fails before merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(npm)"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    # Major bumps of the crypto crates (rand, hmac, sha2, argon2, chacha20poly1305) change their
    # APIs and must move together, so they are ported by hand in one reviewed change.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(cargo)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"
